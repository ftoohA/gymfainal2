<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBVlppMm6idoEw_cXC78mK1OtGXR4EZgnQ",
      authDomain: "gymfilna.firebaseapp.com",
      projectId: "gymfilna",
      storageBucket: "gymfilna.appspot.com",
      messagingSenderId: "480525661276",
      appId: "1:480525661276:web:d010c99b45411e20036299",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.addDoc = addDoc;
    window.getDocs = getDocs;
    window.query = query;
    window.where = where;
  </script>
</head>
<body class="bg-gradient-to-b from-blue-50 to-blue-100 min-h-screen flex items-center justify-center">

<div class="max-w-3xl w-full bg-white shadow-2xl rounded-3xl p-6 text-center">

  <!-- Navigation -->
  <div class="flex gap-2 mb-6 flex-wrap justify-center">
    <button onclick="showPage('today')" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full font-bold transition">تمرين اليوم</button>
    <button onclick="showPage('manage')" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-full font-bold transition">إدارة التمارين</button>
    <button onclick="showPage('schedule')" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold transition">الجدول الأسبوعي</button>
  </div>

  <!-- Today Page -->
  <div id="todayPage">
    <h2 class="text-2xl font-extrabold mb-4 text-gray-800">📅 تمارين اليوم</h2>
    <div id="todayExercises" class="flex flex-wrap justify-center gap-4"></div>
  </div>

  <!-- Manage Page -->
  <div id="managePage" class="hidden">
    <h2 class="text-2xl font-extrabold mb-4 text-gray-800">➕ إضافة تمرين</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 justify-items-center">
      <input id="exerciseName" placeholder="اسم التمرين" class="border p-3 rounded-lg w-full md:w-64 text-center">
      <input id="exerciseImage" type="file" accept="image/*" class="border p-3 rounded-lg w-full md:w-64">
      <select id="exerciseDay" class="border p-3 rounded-lg w-full md:w-64 text-center">
        <option value="0">الأحد</option>
        <option value="1">الإثنين</option>
        <option value="2">الثلاثاء</option>
        <option value="3">الأربعاء</option>
        <option value="4">الخميس</option>
        <option value="5">الجمعة</option>
        <option value="6">السبت</option>
      </select>
      <button onclick="addExercise()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold transition">إضافة</button>
    </div>
    <h2 class="text-xl font-bold mb-3 text-gray-700">📚 كل التمارين</h2>
    <div id="exerciseList" class="space-y-3"></div>
  </div>

  <!-- Schedule Page -->
  <div id="schedulePage" class="hidden">
    <h2 class="text-2xl font-extrabold mb-4 text-gray-800">📊 الجدول الأسبوعي</h2>
    <div class="overflow-x-auto">
      <table class="w-full border rounded-xl overflow-hidden">
        <thead class="bg-blue-100">
          <tr>
            <th class="border p-3 text-gray-700">اليوم</th>
            <th class="border p-3 text-gray-700">التمارين</th>
          </tr>
        </thead>
        <tbody id="scheduleTable" class="bg-white"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal for Exercise Weights -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
  <div class="bg-white p-6 rounded-2xl w-full max-w-md text-center">
    <h3 id="modalTitle" class="font-bold text-xl mb-3"></h3>
    <div id="modalHistory" class="mb-4 max-h-40 overflow-y-auto text-gray-600"></div>
    <input id="newWeight" type="number" placeholder="الوزن الجديد" class="border p-3 rounded-lg w-full mb-3 text-center">
    <input id="newReps" type="number" placeholder="التكرارات" class="border p-3 rounded-lg w-full mb-4 text-center">
    <button onclick="saveWeight()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full font-bold w-full mb-3 transition">حفظ</button>
    <button onclick="closeModal()" class="bg-gray-400 hover:bg-gray-500 text-white px-6 py-2 rounded-full font-bold w-full transition">إغلاق</button>
  </div>
</div>

<!-- Modal for Image Zoom -->
<div id="imageModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4">
  <div class="relative">
    <img id="zoomedImage" class="max-w-full max-h-screen rounded-2xl shadow-lg">
    <button onclick="closeImageModal()" class="absolute top-2 right-2 bg-red-500 text-white px-3 py-1 rounded-full">إغلاق</button>
  </div>
</div>

<script type="module">
import { db, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

let exercises = [];
let workouts = [];
let selectedExerciseId = null;
const days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

async function saveExercise(ex) { await addDoc(collection(db,"exercises"),ex); }
async function saveWorkout(w) { await addDoc(collection(db,"workouts"),w); }

async function loadExercises(){
  const snap = await getDocs(collection(db,"exercises"));
  exercises = snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function loadWorkouts(){
  const snap = await getDocs(collection(db,"workouts"));
  workouts = snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function showPage(page){
  document.getElementById("todayPage").classList.toggle("hidden",page!=='today');
  document.getElementById("managePage").classList.toggle("hidden",page!=='manage');
  document.getElementById("schedulePage").classList.toggle("hidden",page!=='schedule');
  await loadExercises(); await loadWorkouts();
  if(page==='today') showToday();
  if(page==='manage') showExerciseList();
  if(page==='schedule') showSchedule();
}

async function addExercise(){
  const name = document.getElementById("exerciseName").value;
  const day = document.getElementById("exerciseDay").value;
  const imageInput = document.getElementById("exerciseImage");
  if(!name) return;
  let image = null;
  if(imageInput.files[0]){
    const reader = new FileReader();
    reader.onload = async (e)=>{
      image = e.target.result;
      const ex = {name,day,image};
      await saveExercise(ex);
      await showPage('manage');
    };
    reader.readAsDataURL(imageInput.files[0]);
  } else {
    const ex = {name,day,image};
    await saveExercise(ex);
    await showPage('manage');
  }
}

function showExerciseList(){
  const div=document.getElementById("exerciseList"); div.innerHTML="";
  exercises.forEach(ex=>{
    div.innerHTML+=`<div class="border p-3 rounded-xl flex justify-between items-center shadow-md hover:shadow-lg transition">
      <div class="flex items-center gap-3 justify-center">${ex.image?`<img src="${ex.image}" class="w-12 h-12 rounded-lg">`:''}<span>${ex.name} - ${days[ex.day]}</span></div>
    </div>`;
  });
}

function showToday(){
  const today=new Date().getDay();
  const div=document.getElementById("todayExercises"); div.innerHTML="";
  exercises.filter(e=>e.day==today).forEach(ex=>{
    const last=workouts.filter(w=>w.exerciseId==ex.id).slice(-1)[0];
    const completed=workouts.some(w=>w.exerciseId==ex.id);
    div.innerHTML+=`<div id="exercise-${ex.id}" onclick="openModal('${ex.id}')" class="border p-4 rounded-2xl flex items-center gap-4 cursor-pointer transition-colors shadow-md hover:shadow-xl ${completed?'bg-orange-300':'bg-white'}">
      ${ex.image?`<img src="${ex.image}" class="w-20 h-20 rounded-lg">`:''}
      <div><div class="font-bold text-lg">${ex.name}</div><div class="text-gray-600 mt-1">${last?`آخر وزن: ${last.weight}kg × ${last.reps}`:'لا يوجد سجل'}</div></div>
    </div>`;
  });
}

function showSchedule(){
  const table=document.getElementById("scheduleTable"); table.innerHTML="";
  days.forEach((dayName,index)=>{
    const dayExercises=exercises.filter(e=>e.day==index);
    const exerciseHtml=dayExercises.map(ex=>`<div class="inline-block w-10 h-10 rounded-full overflow-hidden mr-1 mb-1 border-2 border-blue-300 cursor-pointer" onclick="openImageModal('${ex.image}')">${ex.image?`<img src='${ex.image}' class='w-full h-full object-cover rounded-full'>`:''}</div>`).join('');
    table.innerHTML+=`<tr><td class="border p-3 font-bold text-gray-700">${dayName}</td><td class="border p-3">${exerciseHtml||'لا يوجد تمارين'}</td></tr>`;
  });
}

function openModal(id){
  selectedExerciseId=id;
  const ex=exercises.find(e=>e.id===id);
  document.getElementById("modalTitle").innerText=ex.name;
  const historyDiv=document.getElementById("modalHistory");
  const history=workouts.filter(w=>w.exerciseId===id);
  historyDiv.innerHTML=history.map(w=>`<div>${w.date} - ${w.weight}kg × ${w.reps}</div>`).join('');
  document.getElementById("modal").classList.remove("hidden"); document.getElementById("modal").classList.add("flex");
}

function closeModal(){document.getElementById("modal").classList.add("hidden");}

async function saveWeight(){
  const weight=document.getElementById("newWeight").value;
  const reps=document.getElementById("newReps").value;
  if(!weight) return;
  const w = {exerciseId:selectedExerciseId,weight,reps,date:new Date().toISOString().split('T')[0]};
  await saveWorkout(w);
  closeModal(); await showPage('today');
}

function openImageModal(src){
  if(!src) return;
  document.getElementById('zoomedImage').src=src;
  document.getElementById('imageModal').classList.remove('hidden');
  document.getElementById('imageModal').classList.add('flex');
}

function closeImageModal(){
  document.getElementById('imageModal').classList.add('hidden');
}

showPage('today');
</script>

</body>
</html>
